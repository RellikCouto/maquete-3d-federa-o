<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maquete 3D — Campus Federação (UCSal 65 anos)</title>
<style>
:root{--bg1:#efeae0;--bg2:#cfc6b4;--fg:#2b2218;--pan:rgba(255,252,245,.88);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a2620;--bg2:#15130f;--fg:#f1e9da;--pan:rgba(40,35,28,.88)}}
:root[data-theme="dark"]{--bg1:#2a2620;--bg2:#15130f;--fg:#f1e9da;--pan:rgba(40,35,28,.88)}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 30%,var(--bg1),var(--bg2));color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
canvas{display:block;touch-action:none;cursor:grab}
.ui{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
button{background:var(--pan);color:var(--fg);border:1px solid rgba(120,100,70,.4);border-radius:8px;padding:8px 12px;font-size:14px}
.t{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:10px;right:10px;text-align:center;font-size:13px;pointer-events:none}
.t b{font-size:16px}
.ref{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);z-index:5;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(70px + env(safe-area-inset-bottom,0px))}
.ref.on{display:flex}.ref figure{margin:0;max-width:100%;max-height:100%;text-align:center;color:#fff;font-size:13px}
.ref img{max-width:100%;max-height:calc(100vh - 150px);border-radius:8px;box-shadow:0 6px 30px rgba(0,0,0,.5)}
.th{position:fixed;right:10px;top:calc(64px + env(safe-area-inset-top,0px));width:120px;border-radius:8px;border:2px solid #c9a24a;cursor:pointer;z-index:4;box-shadow:0 3px 12px rgba(0,0,0,.4)}
body.foto canvas{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top,0px));border:2px solid #c9a24a;border-radius:8px;z-index:6;cursor:pointer;background:var(--bg1);box-shadow:0 4px 16px rgba(0,0,0,.5)}
body.foto .ref{display:flex}body.foto .th,body.foto .ui,body.foto .t{display:none}
.ref{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}.ref img{max-height:calc(100vh - 110px)}.ref button{margin-top:8px}
</style></head><body>
